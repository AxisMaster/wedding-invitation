openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rsvp
    description: Wedding invitation responses
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rsvp:
    post:
      operationId: submitRsvp
      tags: [rsvp]
      summary: Submit a wedding RSVP
      description: Records an invitation response when storage is configured, or acknowledges it in demo mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "200":
          description: RSVP received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpReceipt"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RsvpInput:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        attendance:
          type: string
          enum: [yes, no, maybe]
        guests:
          type: integer
          minimum: 1
          maximum: 6
        message:
          type: string
          maxLength: 500
        website:
          type: string
          maxLength: 200
      required: [fullName, attendance, guests, website]
    RsvpReceipt:
      type: object
      properties:
        received:
          type: boolean
        stored:
          type: boolean
      required: [received, stored]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

